name: Build DevisPro Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pyinstaller customtkinter darkdetect packaging pillow pypdfium2 cryptography requests pandas openpyxl lxml

    - name: Install Tesseract (Windows)
      run: |
        choco install tesseract -y --no-progress
        echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
        $env:TESSDATA_PREFIX = "C:\Program Files\Tesseract-OCR\tessdata"
        tesseract --version

    - name: Test imports (debug)
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from devispro import app_gui; print('app_gui import OK')"

    - name: PyInstaller build (PowerShell, correct working dir)
      run: |
        pyinstaller --clean --noconfirm --name DevisPro --windowed --icon=devispro/devispro/icon.ico --add-data "devispro/devispro;devispro" --add-data "devispro/icon.ico;." --add-data "devispro/main_windows.py;." --hidden-import=customtkinter --hidden-import=darkdetect --hidden-import=packaging --hidden-import=PIL --hidden-import=pypdfium2 --hidden-import=cryptography --hidden-import=requests --hidden-import=pandas --hidden-import=openpyxl --hidden-import=lxml --hidden-import=devispro --collect-all=devispro --collect-all=fpdf --collect-all=segno --log-level=DEBUG devispro/main_windows.py 2>&1 | tee pyinstaller_build.log

    - name: Debug dist folder (comprehensive)
      run: |
        Write-Host "=== CWD ==="
        Get-Location
        Write-Host "=== dist folder (if exists) ==="
        if (Test-Path dist) {
          Get-ChildItem dist
          Write-Host "=== dist contents (recursive) ==="
          Get-ChildItem dist -Recurse
        } else {
          Write-Host "dist folder does NOT exist"
        }

    - name: Upload PyInstaller build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pyinstaller-build-log
        path: pyinstaller_build.log
        retention-days: 30

    - name: Create distribution package (with try/catch error handling)
      run: |
        Write-Host "=== PACKAGE STEP START ==="
        Write-Host "CWD: $(Get-Location)"
        
        # Full recursive listing of dist
        Write-Host "=== FULL DIST TREE ==="
        if (Test-Path dist) {
          Get-ChildItem dist -Recurse | ForEach-Object { Write-Host "  $($_.FullName) - $($_.Length) bytes" }
        } else {
          Write-Host "dist NOT FOUND"
        }
        
        # Handle all possible PyInstaller output structures
        $srcPath = ""
        if (Test-Path "dist\DevisPro") {
          $srcPath = "dist\DevisPro"
          Write-Host "Found: dist\DevisPro (directory)"
        } elseif (Test-Path "dist\DevisPro.exe") {
          $srcPath = "dist"
          Write-Host "Found: dist\DevisPro.exe (single file)"
        } elseif (Test-Path "dist") {
          $items = Get-ChildItem dist
          if ($items.Count -gt 0) {
            $srcPath = "dist"
            Write-Host "Found: dist with $($items.Count) items"
            $items | ForEach-Object { Write-Host "  $($_.Name) - $($_.PSIsContainer ? 'dir' : 'file')" }
          }
        }
        
        if ($srcPath -eq "") {
          Write-Error "ERROR: No dist output found"
          exit 1
        }
        
        Write-Host "Using source path: $srcPath"
        
        # Create target directory
        try {
          New-Item -ItemType Directory -Force -Path "DevisPro_Windows" | Out-Null
          Write-Host "Created DevisPro_Windows directory"
        } catch {
          Write-Error "Failed to create DevisPro_Windows: $($_.Exception.Message)"
          exit 1
        }
        
        # Copy files with error handling
        try {
          Copy-Item -Recurse -Force "$srcPath\*" "DevisPro_Windows\"
          Write-Host "Copied from $srcPath to DevisPro_Windows"
        } catch {
          Write-Error "Copy failed: $($_.Exception.Message)"
          Write-Host "Source: $srcPath"
          Write-Host "Target: DevisPro_Windows"
          exit 1
        }
        
        Write-Host "=== DEVISPRO_WINDOWS CONTENTS ==="
        Get-ChildItem DevisPro_Windows -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }

        # Copy Windows Tesseract to package
        Write-Host "=== COPYING TESSERACT ==="
        try {
          if (Test-Path "C:\Program Files\Tesseract-OCR") {
            Copy-Item -Recurse -Force "C:\Program Files\Tesseract-OCR\*" "DevisPro_Windows\tesseract\"
            Write-Host "Tesseract copied successfully"
          } else {
            Write-Host "Tesseract NOT found at C:\Program Files\Tesseract-OCR"
          }
        } catch {
          Write-Warning "Tesseract copy failed: $($_.Exception.Message)"
        }

        # Create README
        $readme = "DevisPro fuer Windows`n=======================`n`nInstallation:`n1. Entpacken Sie dieses Archiv an einen beliebigen Ort`n2. Doppelklicken Sie auf DevisPro.exe`n`nSystemvoraussetzungen:`n- Windows 10/11 (64-bit)`n- Keine zusaetzliche Installation noetig`n`nSupport: info@devispro.de`nWeb: www.devispro.de"
        try {
          $readme | Out-File -Encoding UTF8 "DevisPro_Windows\README.txt"
          Write-Host "README created"
        } catch {
          Write-Error "README creation failed: $($_.Exception.Message)"
          exit 1
        }
        
        Write-Host "=== PACKAGE STEP COMPLETE ==="

    - name: Create ZIP
      run: |
        cd DevisPro_Windows
        7z a -tzip ..\DevisPro_Windows.zip .
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DevisPro-Windows
        path: DevisPro_Windows.zip
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: DevisPro_Windows.zip
        generate_release_notes: true