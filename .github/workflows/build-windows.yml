name: Build DevisPro Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pyinstaller customtkinter darkdetect packaging pillow pypdfium2 cryptography requests pandas openpyxl lxml

    - name: Install Tesseract (Windows)
      run: |
        choco install tesseract -y --no-progress
        echo "C:\Program Files\Tesseract-OCR" >> $GITHUB_PATH
        echo "TESSDATA_PREFIX=C:\Program Files\Tesseract-OCR\tessdata" >> $GITHUB_ENV
        tesseract --version

    - name: Test imports (debug)
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from devispro import app_gui; print('app_gui import OK')"

    - name: Test PyInstaller analysis (debug)
      run: |
        python -m PyInstaller --clean --noconfirm ^
          --name DevisPro ^
          --windowed ^
          --icon=devispro/devispro/icon.ico ^
          --add-data "devispro/devispro;devispro" ^
          --add-data "devispro/icon.ico;." ^
          --add-data "devispro/main_windows.py;." ^
          --hidden-import=customtkinter ^
          --hidden-import=darkdetect ^
          --hidden-import=packaging ^
          --hidden-import=PIL ^
          --hidden-import=pypdfium2 ^
          --hidden-import=cryptography ^
          --hidden-import=requests ^
          --hidden-import=pandas ^
          --hidden-import=openpyxl ^
          --hidden-import=lxml ^
          --log-level=DEBUG ^
          devispro/main_windows.py

    - name: Build with PyInstaller (from root, clean entry point)
      run: |
        pyinstaller --clean --noconfirm ^
          --name DevisPro ^
          --windowed ^
          --icon=devispro/devispro/icon.ico ^
          --add-data "devispro/devispro;devispro" ^
          --add-data "devispro/icon.ico;." ^
          --add-data "devispro/main_windows.py;." ^
