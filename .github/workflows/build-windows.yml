name: Build DevisPro Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pyinstaller customtkinter darkdetect packaging pillow pypdfium2 cryptography requests pandas openpyxl lxml

    - name: Install Tesseract (Windows)
      run: |
        choco install tesseract -y --no-progress
        echo "C:\Program Files\Tesseract-OCR" >> $GITHUB_PATH
        echo "TESSDATA_PREFIX=C:\Program Files\Tesseract-OCR\tessdata" >> $GITHUB_ENV
        tesseract --version

    - name: Prepare source (use clean devispro/devispro)
      run: |
        # Use the clean nested package
        mkdir build_src
        xcopy /E /I /Y devispro\devispro\* build_src\devispro\
        dir build_src\devispro

    - name: Build with PyInstaller
      working-directory: ./build_src
      run: |
        pyinstaller --clean --noconfirm ^
          --name DevisPro ^
          --windowed ^
          --icon=devispro/icon.ico ^
          --add-data "devispro;devispro" ^
          --hidden-import=customtkinter ^
          --hidden-import=darkdetect ^
          --hidden-import=packaging ^
          --hidden-import=PIL ^
          --hidden-import=pypdfium2 ^
          --hidden-import=cryptography ^
          --hidden-import=requests ^
          --hidden-import=pandas ^
          --hidden-import=openpyxl ^
          --hidden-import=lxml ^
          --hidden-import=crypto_rsa ^
          --hidden-import=license_admin ^
          --hidden-import=segno ^
          --hidden-import=fpdf ^
          --hidden-import=importers ^
          --hidden-import=parsers ^
          --hidden-import=providers ^
          --hidden-import=history ^
          --hidden-import=firmen_preise ^
          --hidden-import=ch_preise ^
          --hidden-import=pricing ^
          --hidden-import=license ^
          --hidden-import=trial_counter ^
          --hidden-import=benchmark ^
          --hidden-import=abo ^
          --hidden-import=kantone ^
          --hidden-import=multicurrency ^
          --hidden-import=accounting ^
          --hidden-import=marketing ^
          --hidden-import=diagnostics ^
          --hidden-import=agent ^
          --hidden-import=monitor ^
          --hidden-import=erp ^
          --hidden-import=bridge_agent ^
          --hidden-import=backup ^
          --hidden-import=ordner_import ^
          --hidden-import=templates ^
          --hidden-import=version ^
          --hidden-import=stammdaten ^
          --hidden-import=models ^
          --hidden-import=importers.datanorm ^
          --hidden-import=importers.crbx ^
          --hidden-import=importers.gaeb ^
          --hidden-import=importers.oenorm ^
          --hidden-import=importers.xrechnung ^
          --hidden-import=importers.bauweb ^
          --hidden-import=importers.sia451 ^
          --hidden-import=parsers.crb ^
          --hidden-import=parsers.crb_sia ^
          --hidden-import=parsers.json_if ^
          --hidden-import=parsers.partner_api ^
          --hidden-import=parsers.sia451_roundtrip ^
          --hidden-import=providers.base ^
          --hidden-import=providers.http_llm ^
          --hidden-import=providers.local ^
          --hidden-import=providers.mock ^
          --hidden-import=analysen_bibliothek ^
          --hidden-import=anleitung ^
          --hidden-import=ctk_theme ^
          --hidden-import=theme ^
          --hidden-import=cli ^
          --hidden-import=connector ^
          --hidden-import=exporter ^
          --hidden-import=extras ^
          --hidden-import=kalkulation ^
          --hidden-import=lead_magnet ^
          --hidden-import=lifecycle ^
          --hidden-import=local_ai ^
          --hidden-import=mahnung ^
          --hidden-import=margen_copilot ^
          --hidden-import=matcher ^
          --hidden-import=npk ^
          --hidden-import=pdf ^
          --hidden-import=pdf_export ^
          --hidden-import=pdf_native ^
          --hidden-import=plausibility ^
          --hidden-import=portal_import ^
          --hidden-import=preise_gui ^
          --hidden-import=preise_import ^
          --hidden-import=pricelist ^
          --hidden-import=prompts ^
          --hidden-import=qr_rechnung ^
          --hidden-import=qr_render ^
          --hidden-import=rechnung ^
          --hidden-import=recurring ^
          --hidden-import=roi ^
          --hidden-import=sample_project ^
          --hidden-import=subunternehmer ^
          --hidden-import=system ^
          --hidden-import=team_auth ^
          --hidden-import=team_sync ^
          --hidden-import=updates ^
          --hidden-import=validators ^
          --hidden-import=vision ^
          --hidden-import=whatsapp_bot ^
          --hidden-import=whitelabel ^
          --hidden-import=zahlungsplan ^
          --hidden-import=fpdf.actions ^
          --hidden-import=fpdf.annotations ^
          --hidden-import=fpdf.bidi ^
          --hidden-import=fpdf.data.color_profiles ^
          --hidden-import=fpdf.deprecation ^
          --hidden-import=fpdf.drawing ^
          --hidden-import=fpdf.drawing_primitives ^
          --hidden-import=fpdf.encryption ^
          --hidden-import=fpdf.enums ^
          --hidden-import=fpdf.errors ^
          --hidden-import=fpdf.font_type_3 ^
          --hidden-import=fpdf.fonts ^
          --hidden-import=fpdf.fpdf ^
          --hidden-import=fpdf.graphics_state ^
          --hidden-import=fpdf.html ^
          --hidden-import=fpdf.image_datastructures ^
          --hidden-import=fpdf.image_parsing ^
          --hidden-import=fpdf.line_break ^
          --hidden-import=fpdf.linearization ^
          --hidden-import=fpdf.outline ^
          --hidden-import=fpdf.output ^
          --hidden-import=fpdf.pattern ^
          --hidden-import=fpdf.prefs ^
          --hidden-import=fpdf.recorder ^
          --hidden-import=fpdf.sign ^
          --hidden-import=fpdf.structure_tree ^
          --hidden-import=fpdf.svg ^
          --hidden-import=fpdf.syntax ^
          --hidden-import=fpdf.table ^
          --hidden-import=fpdf.template ^
          --hidden-import=fpdf.text_region ^
          --hidden-import=fpdf.transitions ^
          --hidden-import=fpdf.unicode_script ^
          --hidden-import=fpdf.util ^
          --log-level=DEBUG ^
          devispro/app_gui.py

    - name: Create distribution package
      working-directory: ./build_src
      run: |
        mkdir DevisPro_Windows
        xcopy /E /I /Y dist\DevisPro\* DevisPro_Windows\

        # Copy Windows Tesseract to package
        xcopy /E /I /Y "C:\Program Files\Tesseract-OCR\*" DevisPro_Windows\tesseract\

        # Create README
        echo DevisPro für Windows> DevisPro_Windows\README.txt
        echo =======================>> DevisPro_Windows\README.txt
        echo.>> DevisPro_Windows\README.txt
        echo Installation:>> DevisPro_Windows\README.txt
        echo 1. Entpacken Sie dieses Archiv an einen beliebigen Ort>> DevisPro_Windows\README.txt
        echo 2. Doppelklicken Sie auf DevisPro.exe>> DevisPro_Windows\README.txt
        echo.>> DevisPro_Windows\README.txt
        echo Systemvoraussetzungen:>> DevisPro_Windows\README.txt
        echo - Windows 10/11 (64-bit)>> DevisPro_Windows\README.txt
        echo - Keine zusätzliche Installation nötig>> DevisPro_Windows\README.txt
        echo.>> DevisPro_Windows\README.txt
        echo Support: info@devispro.de>> DevisPro_Windows\README.txt
        echo Web: www.devispro.de>> DevisPro_Windows\README.txt

    - name: Create ZIP
      working-directory: ./build_src
      run: |
        cd DevisPro_Windows
        7z a -tzip ..\DevisPro_Windows.zip .
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DevisPro-Windows
        path: build_src/DevisPro_Windows.zip
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build_src/DevisPro_Windows.zip
        generate_release_notes: true