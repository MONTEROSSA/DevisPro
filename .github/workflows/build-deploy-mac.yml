name: Build & Deploy DevisPro Mac

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-deploy-mac:
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Import Developer ID certificate
      env:
        MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
        MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
        KEYCHAIN_PASSWORD: devpro-build-key
      run: |
        set -e
        KEYCHAIN_PATH="$RUNNER_TEMP/devispro_keychain-db"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
        echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devispro.p12"
        security import "$RUNNER_TEMP/devispro.p12" \
          -k "$KEYCHAIN_PATH" \
          -P "$MAC_CERT_P12_PASSWORD" \
          -T /usr/bin/codesign \
          -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        echo "Certificate imported"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python deps
      run: |
        pip install --upgrade pip
        pip install customtkinter darkdetect pillow pypdfium2 cryptography requests pandas openpyxl lxml fpdf segno fastapi 'uvicorn[standard]'

    - name: Build app bundle from source
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        KEYCHAIN_PASSWORD: devpro-build-key
      run: |
        set -e
        # Plan B: NUR Build + Ad-Hoc-Sign (KEIN Apple-Notarize, KEIN Developer-ID)
        # Das Developer-ID-Sign + Apple-Notarization läuft LOKAL auf deinem Mac via
        # sign_fix.command (siehe ~/devis-auto/DevisPro_sign_fix.command).
        bash .github/scripts/ci_build_only.sh 2>&1 | tail -50

    - name: Upload .app artifact
      uses: actions/upload-artifact@v4
      with:
        name: DevisPro-macOS-adhoc
        path: DevisPro-macOS-adhoc.zip
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: "DevisPro ${{ github.ref_name }}"
        body: |
          ## DevisPro ${{ github.ref_name }} - Ad-Hoc signed

          **Plan B Build:** CI-based ad-hoc codesign (kein Apple-Notarization).
          Für die offizielle Developer-ID-signierte und Apple-notarisierte Version
          siehe den lokalen sign_fix auf deinem Mac.

          ### Download
          - **macOS** (diese Version): `DevisPro-macOS-adhoc.zip` (Artifact oben)
          - **macOS** (offiziell, lokal signiert): https://devispro.de/DevisPro-2026-09-03-adhoc.zip
          - **Windows**: https://github.com/MONTEROSSA/DevisPro/releases/download/v1.3.1/DevisPro-Windows.zip (bald aktualisiert)

          ### Features in v1.4.x
          - ✅ 4 Profit-Module: Verbandskataloge (NPK/BKS/HLKS/CRB), Marktplatz, Cloud-Sync, ERP-Ecosystem
          - ✅ FastAPI-basiertes Partner-API mit echten Datenanbindungen
          - ✅ 19 LLM-Cron-Jobs repariert (Provider-Modell-Wechsel)
          - ✅ Vollständige Landingpage mit allen Modulen
        draft: false
        prerelease: false
        files: |
          DevisPro-macOS-adhoc.zip

    - name: Deploy to VPS
      env:
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
      run: |
        set -e
        mkdir -p ~/.ssh
        echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
        chmod 600 ~/.ssh/vps_key
        ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
        scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o BatchMode=yes \
          DevisPro-macOS-adhoc.zip "root@${VPS_HOST}:/opt/devispro_app/DevisPro_Mac.zip"
        ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o BatchMode=yes \
          "root@${VPS_HOST}" "
            set -e
            cp /opt/devispro_app/DevisPro_Mac.zip /var/www/devispro/DevisPro_Mac.zip
            chmod 644 /var/www/devispro/DevisPro_Mac.zip
            DATE=\$(date +%Y-%m-%d)
            cp /var/www/devispro/DevisPro_Mac.zip /var/www/devispro/DevisPro-\${DATE}-ci-adhoc.zip
            chmod 644 /var/www/devispro/DevisPro-\${DATE}-ci-adhoc.zip
            systemctl reload nginx
            echo DEPLOYED
          "
        sleep 3
        curl -sI "https://devispro.de/DevisPro_Mac.zip" | head -2
